{% extends 'calculator/base.html' %}
{% load static %}

{% block title %}Accès YounYami{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center min-vh-100">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-4">
            <div class="card-body p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-lock text-primary" style="font-size: 4rem;"></i>
                    <h3 class="mt-3">Accès Sécurisé</h3>
                    <p class="text-muted">Entrez le code pour accéder au site</p>
                </div>
                
                {% if locked %}
                <div class="alert alert-danger">
                    <i class="fas fa-exclamation-triangle"></i>
                    Trop de tentatives. Veuillez réessayer plus tard.
                </div>
                {% else %}
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <input 
                            type="password" 
                            name="access_code" 
                            class="form-control form-control-lg text-center" 
                            placeholder="••••••"
                            maxlength="100"
                            autocomplete="off"
                            required
                            autofocus
                        >
                    </div>
                    <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill">
                        <i class="fas fa-unlock"></i> Accéder
                    </button>
                </form>
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock %}
